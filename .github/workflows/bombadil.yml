name: Bombadil

# Bombadil explores the group page of the preview build in a real browser and checks the product's
# rules (bombadil/spec.ts): briefly on each pull request, and for longer on main every night or when
# started by hand. It is not a merge gate yet. A broken rule fails this workflow's check on the pull
# request and leaves the jobs of the CI workflow alone. On main, a failure opens an issue, or comments
# on the one already open.

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Get Tailwind
        # The same download as in the Dockerfile.
        run: |
          curl -sfL -o tailwindcss https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-linux-x64
          chmod a+x tailwindcss

      - name: Get bombadil
        # At the version and checksum pinned in the script.
        run: ./bombadil/install.sh

      - name: Show the browser
        # Bombadil uses the Chrome that the runner comes with.
        run: google-chrome --version

      # Each run has a step timeout above its time limit, so that a run that hangs still leaves its logs
      # and opens an issue.
      - name: Explore on a desktop screen
        id: desktop
        timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 27 }}
        env:
          BOMBADIL_TIME_LIMIT: ${{ github.event_name == 'pull_request' && '3m' || '20m' }}
          BOMBADIL_OUTPUT: ${{ runner.temp }}/bombadil/desktop
          # Chrome's sandbox needs user namespaces, which GitHub's Ubuntu runners restrict.
          BOMBADIL_ARGS: --no-sandbox --width 1280 --height 800
        run: ./bombadil/run.sh

      - name: Explore on a phone screen
        # Only at night and when started by hand, and only if the desktop run got going.
        if: ${{ !cancelled() && github.event_name != 'pull_request' && (steps.desktop.outcome == 'success' || steps.desktop.outcome == 'failure') }}
        timeout-minutes: 17
        env:
          BOMBADIL_TIME_LIMIT: 10m
          BOMBADIL_OUTPUT: ${{ runner.temp }}/bombadil/phone
          BOMBADIL_ARGS: --no-sandbox --width 390 --height 844
        run: ./bombadil/run.sh

      - name: Keep the logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bombadil-logs
          path: |
            ${{ runner.temp }}/bombadil/**/*.log
            ${{ runner.temp }}/bombadil/**/violated.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep the traces
        # A trace holds a screenshot of every state, about 30 MB a minute, so only a failed run keeps it.
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: bombadil
          path: ${{ runner.temp }}/bombadil/
          if-no-files-found: ignore
          retention-days: 14

  report:
    needs: explore
    if: ${{ failure() && github.event_name != 'pull_request' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - name: Get the logs
        uses: actions/download-artifact@v8.0.2
        continue-on-error: true
        with:
          name: bombadil-logs
          path: ${{ runner.temp }}/bombadil

      - name: Open an issue, or comment on the open one
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          LABEL: bombadil
          OUTPUT: ${{ runner.temp }}/bombadil
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create "$LABEL" --color D93F0B --description "A bombadil run on main failed" || true

          body="$RUNNER_TEMP/bombadil-issue.md"
          printf 'The `Bombadil` workflow failed on `main`: %s\n' "$RUN_URL" >"$body"

          # What broke on each screen, from the end of bombadil's log, which names the rule and shows the
          # values that broke it.
          failed="desktop"
          for screen in desktop phone; do
            log="$(find "$OUTPUT/$screen" -name '*-bombadil.log' 2>/dev/null | head -n 1)"
            [ -n "$log" ] || continue
            if [ -s "$OUTPUT/$screen/violated.txt" ]; then
              failed="$screen"
              printf '\nOn the %s screen, bombadil found a broken rule: %s\n\n```text\n' "$screen" "$(paste -sd ' ' "$OUTPUT/$screen/violated.txt")" >>"$body"
              sed -n '/ was violated:$/,/^Test finished/p' "$log" | head -n 80 >>"$body"
              printf '\n```\n' >>"$body"
            elif ! grep -q '^No rule broke\.$' "$log"; then
              printf '\nOn the %s screen, the run failed without a broken rule. The end of its log:\n\n```text\n' "$screen" >>"$body"
              tail -n 30 "$log" >>"$body"
              printf '\n```\n' >>"$body"
            fi
          done

          # Unquoted, for the variables, so each backtick is escaped.
          cat >>"$body" <<EOF

          The run's \`bombadil\` artifact holds the traces, with a screenshot of every state. To look at the $failed run's from a checkout:

          \`\`\`sh
          gh run download $RUN_ID --name bombadil --dir bombadil-$RUN_ID
          "\$(./bombadil/install.sh)" browser inspect bombadil-$RUN_ID/$failed/*.trace
          \`\`\`

          If nothing above names a broken rule, the run failed before or around bombadil, and the run's page says why. \`docs/research/bombadil.md\` says how to read a failure.
          EOF

          existing="$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body"
          else
            gh issue create --title "A bombadil run on main failed" --label "$LABEL" --body-file "$body"
          fi
